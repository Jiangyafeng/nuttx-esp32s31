# ESP32-S31 Wi-Fi Station + SoftAP coexistence profile.
#
# Extends the production configuration with concurrent Station (wlan0) and
# SoftAP (wlan1) interfaces, a DHCP server for SoftAP clients, and optional
# IPv4 forwarding/NAT via iptables.

#include "production.conf"

# CONFIG_ESPRESSIF_WIFI_STATION is not set
CONFIG_ESPRESSIF_WIFI_STATION_SOFTAP=y
CONFIG_ESPRESSIF_WIFI_SOFTAP_DEFAULT_SSID="ESP32S31-AP"
CONFIG_ESPRESSIF_WIFI_SOFTAP_DEFAULT_PASSWORD="nuttx12345"
CONFIG_ESPRESSIF_WIFI_SOFTAP_CHANNEL=1
CONFIG_ESPRESSIF_WIFI_SOFTAP_MAX_CONNECTIONS=4
CONFIG_IOB_NBUFFERS=128
CONFIG_IOB_NCHAINS=48
CONFIG_NET_BINDTODEVICE=y
CONFIG_NETUTILS_DHCPD=y
CONFIG_NETUTILS_DHCPD_ROUTERIP=0xc0a80401
CONFIG_NETUTILS_DHCPD_STARTIP=0xc0a80402
CONFIG_NETUTILS_DHCPD_NETMASK=0xffffff00
CONFIG_EXAMPLES_DHCPD=y
CONFIG_NET_ROUTE=y
CONFIG_NET_IPFORWARD=y
CONFIG_NET_NAT=y
CONFIG_NET_NETLINK=y
CONFIG_NETLINK_ROUTE=y
CONFIG_SYSTEM_IPTABLES=y
